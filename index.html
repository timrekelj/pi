<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Pi</title>
    <style>
        html,
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: monospace;
            font-size: 20px;
        }

        body {
            padding: 12px;
        }

        #stats,
        #loading,
        #pi-digits {
            font: inherit;
        }

        #top-spacer {
            height: 0;
        }

        .pi-chunk {
            display: inline;
            overflow-wrap: anywhere;
            word-break: break-all;
            white-space: normal;
        }

        #loading {
            display: none;
        }
    </style>
</head>
<body>
    <div id="top-spacer"></div>
    <div id="pi-digits"></div>
    <div id="loading">Loading more digits...</div>

    <script>
        class InfinitePi {
            constructor() {
                this.preloadDistance = 1800;
                this.keepChunksBefore = 2;
                this.keepChunksAfter = 2;
                this.maxMountedChunks = this.keepChunksBefore + this.keepChunksAfter + 1;
                this.topSpacerHeight = 0;
                this.lastChunkIndex = Infinity;
                this.scrollFrame = null;

                this.loadedChunks = new Map();
                this.loadingChunks = new Set();
                this.chunkHeights = new Map();

                this.topSpacerElement = document.getElementById('top-spacer');
                this.digitsElement = document.getElementById('pi-digits');
                this.countElement = document.getElementById('digit-count');
                this.chunkIndexElement = document.getElementById('chunk-index');
                this.loadingElement = document.getElementById('loading');

                window.addEventListener('scroll', () => this.schedulePaginationCheck(), { passive: true });
                window.addEventListener('resize', () => this.schedulePaginationCheck());

                this.loadChunk(0);
            }

            async loadChunk(index) {
                if (index < 0 || index > this.lastChunkIndex) return;
                if (this.loadedChunks.has(index) || this.loadingChunks.has(index)) return;

                this.loadingChunks.add(index);
                this.updateLoadingState();

                try {
                    const response = await fetch('pi/' + index + '.txt');

                    if (response.status === 404) {
                        this.lastChunkIndex = Math.min(this.lastChunkIndex, index - 1);
                        return;
                    }

                    if (!response.ok) {
                        throw new Error('Could not load pi/' + index + '.txt');
                    }

                    const digits = (await response.text()).trim();
                    const element = this.createChunkElement(index, digits);

                    this.insertChunk(index, element);
                    this.loadedChunks.set(index, { element, digits: digits.length });
                    this.chunkHeights.set(index, element.offsetHeight);
                    this.updateStats();
                    this.pruneChunks();

                    requestAnimationFrame(() => this.checkPagination());
                } catch (error) {
                    this.loadingElement.textContent = error instanceof Error ? error.message : 'Could not load more digits.';
                    this.loadingElement.style.display = 'block';
                } finally {
                    this.loadingChunks.delete(index);
                    this.updateLoadingState();
                }
            }

            createChunkElement(index, digits) {
                const element = document.createElement('span');

                element.className = 'pi-chunk';
                element.dataset.index = String(index);

                if (index === 0) {
                    element.textContent = digits[0] + '.' + digits.slice(1);
                } else {
                    element.textContent = digits;
                }

                return element;
            }

            insertChunk(index, element) {
                const loadedIndexes = this.getLoadedIndexes();
                const nextIndex = loadedIndexes.find((loadedIndex) => loadedIndex > index);

                if (nextIndex === undefined) {
                    this.digitsElement.appendChild(element);
                } else {
                    this.digitsElement.insertBefore(element, this.loadedChunks.get(nextIndex).element);
                }

                const firstIndex = loadedIndexes[0];

                if (firstIndex !== undefined && index < firstIndex) {
                    const height = this.chunkHeights.get(index) ?? element.offsetHeight;

                    this.topSpacerHeight = Math.max(0, this.topSpacerHeight - height);
                    this.updateTopSpacer();
                }
            }

            schedulePaginationCheck() {
                if (this.scrollFrame !== null) return;

                this.scrollFrame = requestAnimationFrame(() => {
                    this.scrollFrame = null;
                    this.checkPagination();
                });
            }

            checkPagination() {
                if (this.loadedChunks.size === 0) return;

                const indexes = this.getLoadedIndexes();
                const firstIndex = indexes[0];
                const lastIndex = indexes[indexes.length - 1];
                const firstElement = this.loadedChunks.get(firstIndex).element;
                const lastElement = this.loadedChunks.get(lastIndex).element;

                if (firstIndex > 0 && firstElement.getBoundingClientRect().top > -this.preloadDistance) {
                    this.loadChunk(firstIndex - 1);
                }

                if (lastIndex < this.lastChunkIndex && lastElement.getBoundingClientRect().bottom < window.innerHeight + this.preloadDistance) {
                    this.loadChunk(lastIndex + 1);
                }

                this.pruneChunks();
                this.updateStats();
            }

            pruneChunks() {
                if (this.loadedChunks.size <= this.maxMountedChunks) return;

                const currentIndex = this.getCurrentChunkIndex();
                const minIndex = Math.max(0, currentIndex - this.keepChunksBefore);
                const maxIndex = currentIndex + this.keepChunksAfter;

                for (const index of this.getLoadedIndexes()) {
                    if (this.loadedChunks.size <= this.maxMountedChunks) return;

                    if (index < minIndex) {
                        this.removeChunkAbove(index);
                    } else if (index > maxIndex) {
                        this.removeChunkBelow(index);
                    }
                }
            }

            removeChunkAbove(index) {
                const chunk = this.loadedChunks.get(index);

                if (!chunk) return;

                const height = chunk.element.offsetHeight;

                this.chunkHeights.set(index, height);
                chunk.element.remove();
                this.loadedChunks.delete(index);
                this.topSpacerHeight += height;
                this.updateTopSpacer();
            }

            removeChunkBelow(index) {
                const chunk = this.loadedChunks.get(index);

                if (!chunk) return;

                this.chunkHeights.set(index, chunk.element.offsetHeight);
                chunk.element.remove();
                this.loadedChunks.delete(index);
            }

            getCurrentChunkIndex() {
                const viewportMiddle = window.innerHeight / 2;
                let closestIndex = this.getLoadedIndexes()[0];
                let closestDistance = Infinity;

                for (const [index, chunk] of this.loadedChunks) {
                    const rect = chunk.element.getBoundingClientRect();

                    if (rect.top <= viewportMiddle && rect.bottom >= viewportMiddle) {
                        return index;
                    }

                    const distance = Math.min(
                        Math.abs(rect.top - viewportMiddle),
                        Math.abs(rect.bottom - viewportMiddle)
                    );

                    if (distance < closestDistance) {
                        closestDistance = distance;
                        closestIndex = index;
                    }
                }

                return closestIndex;
            }

            getLoadedIndexes() {
                return Array.from(this.loadedChunks.keys()).sort((left, right) => left - right);
            }

            updateTopSpacer() {
                this.topSpacerElement.style.height = this.topSpacerHeight + 'px';
            }

            updateStats() {
                let mountedDigits = 0;

                for (const chunk of this.loadedChunks.values()) {
                    mountedDigits += chunk.digits;
                }

                this.countElement.textContent = mountedDigits.toLocaleString();
                this.chunkIndexElement.textContent = this.getCurrentChunkIndex().toLocaleString();
            }

            updateLoadingState() {
                if (this.loadingChunks.size === 0) {
                    this.loadingElement.style.display = 'none';
                    this.loadingElement.textContent = 'Loading more digits...';
                } else {
                    this.loadingElement.style.display = 'block';
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.piDisplay = new InfinitePi();
        });
    </script>
</body>
</html>
