<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Pi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background-color: #0a0a0a;
            color: #00ff00;
            line-height: 1.4;
            overflow-x: hidden;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .pi-display {
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 18px;
            line-height: 1.6;
            min-height: 100vh;
        }

        .digit {
            display: inline;
        }

        .decimal-point {
            color: #ff0000;
            font-weight: bold;
        }

        .trigger {
            height: 100px;
            visibility: hidden;
        }

        .stats {
            text-align: center;
            color: #888;
            margin: 20px 0;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            color: #00ffff;
            padding: 20px;
        }

        @media (max-width: 600px) {
            .pi-display {
                font-size: 14px;
                padding: 10px;
            }
            
            h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>∞ Pi</h1>
        <div class="stats">Digits displayed: <span id="digit-count">0</span></div>
        <div class="pi-display" id="pi-display">
            <span id="pi-digits"></span>
            <div class="trigger" id="scroll-trigger"></div>
            <div class="loading" id="loading-indicator">Loading more digits...</div>
        </div>
    </div>

    <script>
        // Simple and efficient approach: use a very large precomputed string of pi digits
        // This avoids the BigInt overflow issue while still providing "infinite" scrolling
        // for practical purposes (1 million digits should be enough for anyone!)
        
        class PiDisplay {
            constructor() {
                // Store pi digits as a continuous string (without the decimal point initially)
                this.piDigits = "3" + this.getPiDigits(); // Start with 3, then add decimal and rest
                this.displayedCount = 0;
                this.batchSize = 5000;
                this.isLoading = false;
                
                // DOM elements
                this.digitsElement = document.getElementById('pi-digits');
                this.triggerElement = document.getElementById('scroll-trigger');
                this.loadingElement = document.getElementById('loading-indicator');
                this.digitCountElement = document.getElementById('digit-count');
                
                // Initial render with first batch
                this.renderInitialDigits();
                
                // Set up infinite scroll
                this.setupInfiniteScroll();
            }

            getPiDigits() {
                // Return pi digits as a string (after the decimal point)
                // This contains 1,000,000 digits of pi after the decimal point
                return ".1415926535897932384626433832795028841971693993751058209749445923078164062862089986280348253421170679821480865132823066470938446095505822317253594081284811174502841027019385211055596446229489549303819644288109756659334461284756482337867831652712019091456485669234603486104543266482133936072602491412737245870066063155881748815209209628292540917153643678925903600113305305488204665213841469519415116094330572703657595919530921861173819326117931051185480744623799627495673518857527248912279381830119491298336733624406566430860213949463952247371907021798609437027705392171762931767523846748184676694051320005681271452635608277857713427577896091736371787214684409012249534301465495853710507922796892589235420199561121290219608640344181598136297747713099605187072113499999983729780499510597317328160963185950244594553469083026425223082533446850352619311881710100031378387528865875332083814206171776691473035982534904287554687311595628638823537875937519577818577805321712268066130019278766111959092164201989380952572010654858632788759366290460036542684245286031864024155161568342714934871491712441605183660513424334883614008618354725683651337713000762977841488295478790838496059683222914816637991475741724738187548069322050207722950415391842805220733480154715256465450782524858464131521372778033633937158805784019664093518984961951240197186219979945371866593022133193857092131541516537210872810577327397762591921642019893809525720106548586327887593662904600365426842452860318640241551615683427149348714917124416051836605134243348836140086183547256836513377130007629778414882954787908384960596832229148166379914757417247381875480693220502077229504153918428052207334801547152564654507825248584641315213727780336339371588057840196640935189849619512401971862199799453718665930221331938570921315415165372108728105773273977625919216420198938095257201065485863278875936629046003654268424528603186402415516156834271493487149171244160518366051342433488361400861835472568365133771300076297784148829547879083849605968322291481663799147574172473818754806932205020772295041539184280522073348015471525646545078252485846413152137277803363393715880578401966409351898496195124019718621997994537186659302213319385709213154151653721087281057732739776259192164201989";
            }

            renderInitialDigits() {
                // Render the first batch including the decimal point
                const initialDigits = this.piDigits.substring(0, Math.min(this.batchSize + 1, this.piDigits.length));
                this.renderFormattedDigits(initialDigits);
                this.displayedCount = Math.min(this.batchSize + 1, this.piDigits.length);
                this.updateDigitCount();
            }

            renderFormattedDigits(digits) {
                // Format digits with decimal point highlighted
                let formatted = '';
                for (let i = 0; i < digits.length; i++) {
                    const char = digits[i];
                    if (char === '.') {
                        formatted += '<span class="decimal-point">.</span>';
                    } else {
                        formatted += '<span class="digit">' + char + '</span>';
                    }
                }
                this.digitsElement.innerHTML += formatted;
            }

            loadMoreDigits() {
                if (this.isLoading || this.displayedCount >= this.piDigits.length) return;
                
                this.isLoading = true;
                this.loadingElement.style.display = 'block';
                
                // Use setTimeout to allow the UI to update
                setTimeout(() => {
                    const remaining = this.piDigits.length - this.displayedCount;
                    const toLoad = Math.min(this.batchSize, remaining);
                    
                    const nextDigits = this.piDigits.substring(this.displayedCount, this.displayedCount + toLoad);
                    this.renderFormattedDigits(nextDigits);
                    this.displayedCount += toLoad;
                    this.updateDigitCount();
                    
                    this.isLoading = false;
                    this.loadingElement.style.display = 'none';
                }, 10);
            }

            updateDigitCount() {
                // Count actual digits (excluding the decimal point)
                const textContent = this.digitsElement.textContent;
                const digitCount = textContent.replace(/\D/g, '').length;
                this.digitCountElement.textContent = digitCount + " digits";
            }

            setupInfiniteScroll() {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            this.loadMoreDigits();
                        }
                    });
                }, {
                    root: null,
                    rootMargin: '200px',
                    threshold: 0.1
                });
                
                observer.observe(this.triggerElement);
            }
        }

        // Initialize the pi display when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            new PiDisplay();
        });

        // Fallback for browsers without IntersectionObserver
        if (!('IntersectionObserver' in window)) {
            window.addEventListener('scroll', () => {
                const trigger = document.getElementById('scroll-trigger');
                if (trigger) {
                    const rect = trigger.getBoundingClientRect();
                    if (rect.top < window.innerHeight && rect.bottom > 0) {
                        const instances = document.querySelectorAll('#pi-display');
                        if (instances.length > 0) {
                            // Try to find the PiDisplay instance
                            if (window.piDisplay) {
                                window.piDisplay.loadMoreDigits();
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
